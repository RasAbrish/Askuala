services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askuala-web
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: askuala-telegram-bot
    env_file:
      - .env
    command: ["npm", "run", "bot:telegram"]
    restart: unless-stopped
    depends_on:
      - web
