services:
  web:
    image: node:20-bookworm-slim
    container_name: askuala-web-dev
    working_dir: /app
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
    ports:
      - "3000:3000"
    command: ["bash", "-lc", "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"]
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    restart: unless-stopped

  telegram-bot:
    image: node:20-bookworm-slim
    container_name: askuala-telegram-bot-dev
    working_dir: /app
    env_file:
      - .env.local
    environment:
      - NODE_ENV=development
    command: ["bash", "-lc", "npm install && npx tsx watch bot/telegram/index.ts"]
    volumes:
      - ./:/app
      - bot_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  web_node_modules:
  web_next_cache:
  bot_node_modules:
